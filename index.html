<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>President's Club — F1 Racing Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* ========================================
       CONFIG — Change this to swap sheets
       ======================================== */
    :root {
      /* F1 RACING COLORS */
      --bg-primary: #0d0d0d;
      --bg-track: #1a1a1a;
      --bg-card: rgba(255,255,255,0.03);
      --bg-card-hover: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.1);
      --border-hover: rgba(225,6,0,0.4);
      --text-primary: #ffffff;
      --text-secondary: rgba(255,255,255,0.7);
      --text-muted: rgba(255,255,255,0.45);

      /* F1 RACE COLORS */
      --f1-red: #E10600;
      --f1-red-dark: #B00500;
      --f1-white: #FFFFFF;
      --f1-black: #15151E;
      --f1-silver: #C0C0C0;
      --f1-gold: #FFD700;

      /* TEAM COLORS */
      --team-1: #E10600; /* Red Bull / Ferrari Red */
      --team-2: #00D2BE; /* Mercedes Teal */
      --team-3: #FF8700; /* McLaren Orange */
      --team-4: #006F62; /* Aston Martin Green */
      --team-5: #1E41FF; /* Alpine Blue */
      --team-6: #C92D4B; /* Alfa Romeo Red */
      --team-7: #37BEDD; /* Williams Blue */
      --team-8: #B6BABD; /* Haas Silver */

      /* TYPOGRAPHY */
      --font-display: 'Orbitron', monospace;
      --font-body: 'Rajdhani', sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-primary);
      background-image:
        repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(255,255,255,.02) 2px, rgba(255,255,255,.02) 4px),
        repeating-linear-gradient(-45deg, transparent, transparent 2px, rgba(255,255,255,.02) 2px, rgba(255,255,255,.02) 4px);
      color: var(--text-primary);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Racing speed lines */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.02'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }

    /* Ambient glow */
    .ambient-glow {
      position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
      filter: blur(100px);
    }
    .ambient-glow.gold {
      top: -15%; right: -10%; width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(225,6,0,0.15) 0%, transparent 70%);
    }
    .ambient-glow.blue {
      bottom: -10%; left: -10%; width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(255,215,0,0.08) 0%, transparent 70%);
    }

    .container {
      position: relative; z-index: 1;
      max-width: 1400px; margin: 0 auto;
      padding: 80px 40px 100px;
    }

    /* ── Header ── */
    .header {
      margin-bottom: 60px;
      padding-bottom: 40px;
      border-bottom: 3px solid var(--f1-red);
      position: relative;
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 0;
      width: 60px;
      height: 3px;
      background: var(--f1-gold);
    }
    .header-eyebrow {
      font-size: 13px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 6px;
      color: var(--f1-red);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-eyebrow::before {
      content: '';
      width: 40px;
      height: 2px;
      background: var(--f1-red);
    }
    .header-title {
      font-family: var(--font-display);
      font-size: clamp(42px, 7vw, 88px);
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1;
      margin-bottom: 16px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #FFFFFF 0%, #C0C0C0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-title em {
      font-style: normal;
      color: var(--f1-red);
      -webkit-text-fill-color: var(--f1-red);
      text-shadow: 0 0 20px rgba(225,6,0,0.5);
    }
    .header-sub {
      font-size: 18px;
      color: var(--text-secondary);
      font-weight: 500;
      max-width: 700px;
      letter-spacing: 1px;
    }
    .header-sub .live-dot {
      display: inline-block; width: 7px; height: 7px;
      background: var(--accent-green); border-radius: 50%;
      margin-right: 6px; vertical-align: middle;
      animation: pulse 2s ease-in-out infinite;
    }

    /* ── Loading / Error ── */
    .status-msg {
      text-align: center; padding: 120px 32px;
      font-size: 15px; color: var(--text-secondary);
      letter-spacing: 0.5px;
    }
    .status-msg .spinner {
      width: 40px; height: 40px; border: 2px solid var(--border);
      border-top-color: var(--accent-cream);
      border-radius: 50%; margin: 0 auto 28px;
      animation: spin 1s linear infinite;
    }

    /* ── KPI Row ── */
    .kpi-row {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
      margin-bottom: 60px;
    }
    .kpi-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
      border: 2px solid var(--border);
      border-left: 4px solid;
      border-radius: 0;
      padding: 28px 24px;
      position: relative;
      overflow: hidden;
      opacity: 0;
      animation: slideUp 0.5s ease forwards;
      transition: all 0.3s ease;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
    }
    .kpi-card:hover {
      border-color: var(--f1-red);
      transform: translateX(4px);
      box-shadow: -4px 0 0 var(--f1-red);
    }
    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: -50%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
      transform: skewX(-20deg);
    }
    .kpi-card:nth-child(1) { border-left-color: var(--team-1); }
    .kpi-card:nth-child(2) { border-left-color: var(--team-2); }
    .kpi-card:nth-child(3) { border-left-color: var(--team-3); }
    .kpi-card:nth-child(4) { border-left-color: var(--f1-gold); }
    .kpi-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .kpi-value {
      font-family: var(--font-display);
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 0px;
      line-height: 1;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(225,6,0,0.3);
    }
    .kpi-sub {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 8px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── Race Track Section ── */
    .race-track-section {
      margin-bottom: 60px;
      background: linear-gradient(180deg, rgba(26,26,26,0.4) 0%, rgba(13,13,13,0.8) 100%);
      border: 2px solid var(--border);
      border-left: 4px solid var(--f1-red);
      padding: 40px;
      position: relative;
      overflow: hidden;
    }
    .race-track-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 40px,
        rgba(255,255,255,0.02) 40px,
        rgba(255,255,255,0.02) 80px
      );
      pointer-events: none;
    }
    .track-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      position: relative;
      z-index: 1;
    }
    .track-title {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--f1-white);
    }
    .track-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .race-track {
      position: relative;
      background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
      border: 3px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 40px 20px;
      min-height: 500px;
    }
    .track-lane {
      position: relative;
      height: 60px;
      margin-bottom: 12px;
      background: linear-gradient(90deg,
        rgba(255,255,255,0.02) 0%,
        rgba(255,255,255,0.05) 50%,
        rgba(255,255,255,0.02) 100%
      );
      border-left: 3px dashed rgba(255,255,255,0.15);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      overflow: visible;
    }
    .track-lane:last-child {
      margin-bottom: 0;
    }
    .race-car {
      position: absolute;
      left: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px 8px 8px;
      background: linear-gradient(135deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.6) 100%);
      border: 2px solid;
      border-radius: 4px;
      transition: all 1.5s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10;
      animation: carEnter 1s ease-out forwards;
    }
    .race-car.position-1 { border-color: var(--f1-gold); box-shadow: 0 0 20px rgba(255,215,0,0.4); }
    .race-car.position-2 { border-color: var(--f1-silver); box-shadow: 0 0 15px rgba(192,192,192,0.3); }
    .race-car.position-3 { border-color: #CD7F32; box-shadow: 0 0 15px rgba(205,127,50,0.3); }
    .race-car.position-other { border-color: var(--border); }

    .car-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      filter: drop-shadow(0 0 8px currentColor);
    }
    .car-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .car-name {
      font-weight: 700;
      font-size: 14px;
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .car-score {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      color: var(--f1-red);
    }
    .car-position {
      position: absolute;
      left: -30px;
      width: 24px;
      height: 24px;
      background: var(--f1-red);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 12px;
      font-family: var(--font-display);
    }
    .finish-line {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 40px;
      background: repeating-linear-gradient(
        45deg,
        #000,
        #000 10px,
        #fff 10px,
        #fff 20px
      );
      opacity: 0.3;
    }

    @keyframes carEnter {
      from {
        transform: translateX(-100px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* ── Main Grid ── */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    /* ── Leaderboard ── */
    .leaderboard-label {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--f1-red);
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--f1-red);
    }
    .rep-card {
      background: linear-gradient(90deg, rgba(255,255,255,0.02) 0%, transparent 100%);
      border: 1px solid var(--border);
      border-left: 3px solid transparent;
      border-radius: 0;
      padding: 20px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      opacity: 0;
      animation: slideUp 0.4s ease forwards;
    }
    .rep-card:hover {
      background: linear-gradient(90deg, rgba(225,6,0,0.1) 0%, rgba(255,255,255,0.03) 100%);
      border-left-color: var(--f1-red);
      transform: translateX(4px);
    }
    .rep-card.expanded {
      background: linear-gradient(90deg, rgba(225,6,0,0.08) 0%, rgba(255,255,255,0.04) 100%);
      border-color: var(--f1-red);
      border-left-color: var(--f1-red);
    }
    .rep-card.leader {
      border-left-color: var(--f1-gold);
      background: linear-gradient(90deg, rgba(255,215,0,0.08) 0%, rgba(255,255,255,0.04) 100%);
    }
    .rep-card.leader::after {
      content: '🏆';
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 24px;
      opacity: 0.3;
    }
    .rep-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .rep-rank {
      width: 32px;
      height: 32px;
      background: var(--f1-red);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 900;
      flex-shrink: 0;
    }
    .rep-rank.gold {
      background: linear-gradient(135deg, var(--f1-gold) 0%, #FFD700 100%);
      color: #000;
      box-shadow: 0 0 20px rgba(255,215,0,0.5);
    }
    .rep-rank.silver {
      background: linear-gradient(135deg, #E8E8E8 0%, #C0C0C0 100%);
      color: #000;
      box-shadow: 0 0 15px rgba(192,192,192,0.4);
    }
    .rep-rank.bronze {
      background: linear-gradient(135deg, #E8A87C 0%, #CD7F32 100%);
      color: #000;
      box-shadow: 0 0 15px rgba(205,127,50,0.4);
    }
    .rep-avatar {
      width: 48px;
      height: 48px;
      border-radius: 0;
      border: 2px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
      font-family: var(--font-display);
      letter-spacing: 0;
      flex-shrink: 0;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    }
    .rep-info {
      flex: 1;
      min-width: 0;
    }
    .rep-name {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 1px;
      margin-bottom: 6px;
      color: var(--text-primary);
      text-transform: uppercase;
    }
    .rep-tier {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 0;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border: 1px solid;
    }
    .rep-score-wrap {
      text-align: right;
    }
    .rep-score {
      font-family: var(--font-display);
      font-size: 36px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0;
      margin-bottom: 4px;
      text-shadow: 0 0 10px rgba(225,6,0,0.3);
    }
    .rep-score-max {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* ── Expanded Detail ── */
    .rep-detail {
      display: none;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 2px solid rgba(225,6,0,0.2);
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    .rep-card.expanded .rep-detail {
      display: grid;
      animation: fadeIn 0.4s ease;
    }
    .detail-cell {
      text-align: center;
      padding: 12px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .detail-ring {
      width: 60px;
      height: 60px;
      margin: 0 auto 12px;
      position: relative;
    }
    .detail-ring svg {
      transform: rotate(-90deg);
    }
    .detail-ring-bg {
      fill: none;
      stroke: rgba(255,255,255,0.1);
      stroke-width: 4;
    }
    .detail-ring-fg {
      fill: none;
      stroke-width: 4;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s cubic-bezier(0.4,0,0.2,1);
      filter: drop-shadow(0 0 4px currentColor);
    }
    .detail-val {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--text-primary);
      font-weight: 900;
      margin-bottom: 6px;
    }
    .detail-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Pipeline badge */
    .pipeline-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 16px; border-radius: 2px;
      font-size: 11px; font-weight: 600; margin-top: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .pipeline-badge.pass {
      background: rgba(69,182,147,0.12);
      color: var(--accent-green);
      border: 1px solid rgba(69,182,147,0.2);
    }
    .pipeline-badge.fail {
      background: rgba(224,92,92,0.12);
      color: var(--accent-red);
      border: 1px solid rgba(224,92,92,0.2);
    }

    /* ── Right Column Cards ── */
    .panel {
      background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
      border: 1px solid var(--border);
      border-left: 3px solid var(--f1-red);
      border-radius: 0;
      padding: 32px 28px;
      margin-bottom: 24px;
      opacity: 0;
      animation: slideUp 0.5s ease forwards;
      position: relative;
      overflow: hidden;
    }
    .panel::before {
      content: '';
      position: absolute;
      top: 0;
      right: -100px;
      width: 200px;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(225,6,0,0.05), transparent);
      transform: skewX(-20deg);
    }
    .panel:last-child {
      margin-bottom: 0;
    }
    .panel-label {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--f1-red);
      margin-bottom: 28px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--f1-red);
      position: relative;
      z-index: 1;
    }

    /* Chart */
    .chart-container { position: relative; width: 100%; margin-bottom: 40px; }
    .chart-bar-group {
      display: flex; align-items: flex-end; gap: 12px;
      padding: 0; justify-content: space-between;
    }
    .chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .chart-stack {
      width: 100%; max-width: 48px; border-radius: 1px 1px 0 0;
      overflow: hidden; position: relative;
      transition: all 0.3s ease;
    }
    .chart-stack:hover { opacity: 0.85; transform: translateY(-4px); }
    .chart-seg { width: 100%; transition: height 0.9s cubic-bezier(0.4,0,0.2,1); }
    .chart-name {
      font-size: 11px; color: var(--text-secondary);
      font-weight: 500; white-space: nowrap;
      letter-spacing: 0.5px;
    }
    .chart-legend {
      display: flex; gap: 24px; justify-content: flex-start;
      margin-top: 32px; flex-wrap: wrap;
    }
    .chart-legend-item {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--text-secondary); font-weight: 500;
    }
    .chart-legend-dot { width: 10px; height: 10px; border-radius: 1px; }

    /* Tooltip */
    .chart-tooltip {
      display: none; position: absolute;
      background: rgba(10,10,15,0.98);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 2px; padding: 20px 24px;
      backdrop-filter: blur(30px); z-index: 10;
      pointer-events: none; min-width: 200px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .chart-tooltip.visible { display: block; }
    .chart-tooltip-name {
      font-weight: 600; font-size: 15px;
      margin-bottom: 16px; letter-spacing: -0.2px;
    }
    .chart-tooltip-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 8px; font-size: 13px; color: var(--text-secondary);
    }
    .chart-tooltip-dot { width: 8px; height: 8px; border-radius: 1px; flex-shrink: 0; }
    .chart-tooltip-val { color: var(--text-primary); font-weight: 600; margin-left: auto; }

    /* Scoring & Eligibility */
    .scoring-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .scoring-item {
      padding: 24px 0; border-radius: 0;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .scoring-item-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .scoring-dot { width: 8px; height: 8px; border-radius: 1px; }
    .scoring-item-label {
      font-size: 11px; font-weight: 600;

      letter-spacing: 2px;
    }

      font-family: var(--font-display); font-size: 36px;
      color: var(--text-primary); font-weight: 600;
    }
    .scoring-item-value span {
      font-size: 13px; color: var(--text-muted);
      font-family: var(--font-body);
      font-weight: 400;
    }

    .penalty-box {
      margin-top: 32px; padding: 24px 0;
      border-radius: 0;
      background: transparent;
      border-top: 1px solid rgba(224,92,92,0.15);
      border-bottom: 1px solid rgba(224,92,92,0.15);
    }
    .penalty-title {
      font-size: 11px; font-weight: 600;
      color: var(--accent-red);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .penalty-desc {
      font-size: 14px; color: var(--text-secondary);
    }

    .elig-rule {
      display: flex; align-items: flex-start; gap: 16px;
      padding: 20px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);

    .elig-rule:last-of-type { border-bottom: none; }
    .elig-check {
      width: 24px; height: 24px; border-radius: 2px;
      background: rgba(69,182,147,0.15);
      border: 1px solid rgba(69,182,147,0.25);
      display: flex;
      align-items: center; justify-content: center;
      font-size: 11px; color: var(--accent-green); flex-shrink: 0;
      margin-top: 2px;
    }
    .elig-text {
      font-size: 14px; color: var(--text-secondary);
      font-weight: 400; line-height: 1.6;
    }

    .ramp-box {
      margin-top: 32px; padding: 24px 0 0 0;
      border-radius: 0;
      background: transparent;
      border-top: 1px solid rgba(151,117,228,0.15);
    }
    .ramp-title {
      font-size: 11px; font-weight: 600;
      color: var(--accent-purple);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .ramp-months { display: flex; gap: 32px; }
    .ramp-month { text-align: center; }
    .ramp-val {
      font-family: var(--font-display); font-size: 32px;
      color: var(--text-primary); font-weight: 600;
      margin-bottom: 8px;
    }
    .ramp-label {
      font-size: 11px; color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 60px;
      padding: 32px 0;
      border-top: 3px solid var(--f1-red);
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
      position: relative;
    }
    .footer::before {
      content: '';
      position: absolute;
      top: -3px;
      left: 0;
      width: 60px;
      height: 3px;
      background: var(--f1-gold);
    }

    /* Tier Colors - F1 Racing Teams */
    .tier-elite {
      background: rgba(225,6,0,0.15);
      color: var(--f1-red);
      border-color: var(--f1-red);
    }
    .tier-ontrack {
      background: rgba(255,135,0,0.15);
      color: var(--team-3);
      border-color: var(--team-3);
    }
    .tier-building {
      background: rgba(0,210,190,0.15);
      color: var(--team-2);
      border-color: var(--team-2);
    }
    .tier-ramping {
      background: rgba(30,65,255,0.15);
      color: var(--team-5);
      border-color: var(--team-5);
    }

    /* Animations */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 1200px) {
      .race-track-section { padding: 32px 24px; }
      .track-lane { height: 50px; }
      .race-car { padding: 6px 12px 6px 6px; }
    }
    @media (max-width: 1024px) {
      .container { padding: 48px 24px 60px; }
      .main-grid { grid-template-columns: 1fr; gap: 40px; }
      .race-track { padding: 32px 16px; min-height: 400px; }
    }
    @media (max-width: 768px) {
      .kpi-row { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .header { margin-bottom: 48px; padding-bottom: 32px; }
      .kpi-card { padding: 24px 20px; }
      .kpi-value { font-size: 40px; }
      .track-title { font-size: 24px; }
      .track-lane { height: 45px; }
      .car-name { font-size: 12px; }
      .car-score { font-size: 16px; }
    }
    @media (max-width: 520px) {
      .kpi-row { grid-template-columns: 1fr; }
      .container { padding: 32px 16px 48px; }
      .header-title { font-size: 36px; }
      .header { margin-bottom: 40px; }
      .main-grid { gap: 32px; }
      .race-track-section { padding: 24px 16px; }
      .race-track { padding: 24px 12px; min-height: 350px; }
      .track-lane { height: 40px; margin-bottom: 8px; }
      .race-car { flex-direction: column; gap: 4px; padding: 6px; }
      .car-position { left: -24px; width: 20px; height: 20px; font-size: 10px; }
      .finish-line { width: 30px; }
    }
  </style>
</head>
<body>
  <div class="ambient-glow gold"></div>
  <div class="ambient-glow blue"></div>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-eyebrow">🏁 BDR Racing Championship</div>
      <h1 class="header-title">PRESIDENT'S <em>CLUB</em></h1>
      <div class="header-sub">
        <span class="live-dot"></span>
        <span id="headerSub">Loading race data…</span>
      </div>
    </div>

    <!-- Content fills here via JS -->
    <div id="app">
      <div class="status-msg">
        <div class="spinner"></div>
        Fetching live data from Google Sheets…
      </div>
    </div>

    <div class="footer">
      🏁 Live Race Telemetry · Max 100 Points Per Race · Championship Series 2026
    </div>
  </div>

<script>
// ============================================================
//  CONFIG — To swap sheets, change this ID
// ============================================================
const SHEET_ID = '1iik6pqwS5s02ratye3O62VrY_P2lwsb1C-D7IxtuAP8';
const GID = 0;
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

// ============================================================
//  SCORING CATEGORIES - F1 Performance Metrics
// ============================================================
const CATS = [
  { key: 'sets',     label: 'Qualifying',    max: 30, color: '#E10600' },
  { key: 'held',     label: 'Race Pace',     max: 35, color: '#00D2BE' },
  { key: 'showRate', label: 'Consistency',   max: 15, color: '#FF8700' },
  { key: 'arr',      label: 'Podium Finish', max: 20, color: '#FFD700' },
];

// ============================================================
//  PARSE CSV
// ============================================================
function parseCSV(text) {
  const lines = text.split('\n').map(l => {
    const row = [];
    let inQuote = false, cell = '';
    for (let i = 0; i < l.length; i++) {
      const ch = l[i];
      if (ch === '"') { inQuote = !inQuote; continue; }
      if (ch === ',' && !inQuote) { row.push(cell.trim()); cell = ''; continue; }
      cell += ch;
    }
    row.push(cell.trim());
    return row;
  });
  return lines;
}

function extractReps(lines) {
  // Find the FIRST header row with "Rep" in col A and "Totals" in col G area
  // This corresponds to the current month's filled-in data (rows 25-33)
  let headerIdx = -1;
  for (let i = 0; i < lines.length; i++) {
    if (lines[i][0] && lines[i][0].toLowerCase().includes('rep') &&
        lines[i].some(c => c.toLowerCase().includes('totals'))) {
      headerIdx = i;
      break;
    }
  }
  if (headerIdx === -1) return [];

  const reps = [];
  for (let i = headerIdx + 1; i < lines.length; i++) {
    const row = lines[i];
    const name = (row[0] || '').trim();
    if (!name) break; // empty row = end of block
    const sets = parseFloat(row[1]) || 0;
    const held = parseFloat(row[2]) || 0;
    const showRate = parseFloat(row[3]) || 0;
    const arr = parseFloat(row[4]) || 0;
    const supered = (row[5] || '').trim();
    const total = parseFloat(row[6]) || 0;
    const initials = name.split(' ').map(w => w[0]).join('').toUpperCase();
    reps.push({ name, sets, held, showRate, arr, supered, total, avatar: initials });
  }
  // Sort by total descending
  reps.sort((a, b) => b.total - a.total);
  return reps;
}

// ============================================================
//  TIER LOGIC - F1 Racing Tiers
// ============================================================
function getTier(total) {
  if (total >= 75) return { cls: 'tier-elite',    label: '🏆 PODIUM' };
  if (total >= 60) return { cls: 'tier-ontrack',  label: '🔥 POINTS' };
  if (total >= 40) return { cls: 'tier-building', label: '⚡ MIDFIELD' };
  return                   { cls: 'tier-ramping',  label: '🏁 ROOKIE' };
}

// ============================================================
//  RENDER
// ============================================================
function render(reps) {
  if (!reps.length) {
    document.getElementById('app').innerHTML = `<div class="status-msg">No rep data found in the sheet. Make sure the first table has a "Rep" header row.</div>`;
    return;
  }

  const leader = reps[0];
  const avg = (reps.reduce((s, r) => s + r.total, 0) / reps.length).toFixed(1);
  const qualified = reps.filter(r => r.total >= 60).length;

  document.getElementById('headerSub').textContent = `Live Race Telemetry · ${reps.length} drivers competing`;

  let html = '';

  // Race Track Visualization
  html += `<div class="race-track-section">
    <div class="track-header">
      <div>
        <div class="track-title">🏎️ LIVE RACE POSITIONS</div>
        <div class="track-subtitle">Current standings on track</div>
      </div>
    </div>
    <div class="race-track">
      <div class="finish-line"></div>
      ${reps.map((rep, i) => {
        const maxScore = 100;
        const position = ((rep.total / maxScore) * 85) + 5; // 5-90% of track width
        const positionClass = i === 0 ? 'position-1' : i === 1 ? 'position-2' : i === 2 ? 'position-3' : 'position-other';
        const carColors = ['#E10600', '#00D2BE', '#FF8700', '#006F62', '#1E41FF', '#C92D4B', '#37BEDD', '#B6BABD'];
        const carColor = carColors[i % carColors.length];
        return `<div class="track-lane">
          <div class="race-car ${positionClass}" style="left: ${position}%; animation-delay: ${i * 0.15}s;">
            <div class="car-position">${i + 1}</div>
            <div class="car-icon" style="color: ${carColor};">🏎️</div>
            <div class="car-info">
              <div class="car-name">${rep.name.split(' ')[0]}</div>
              <div class="car-score">${rep.total.toFixed(1)} pts</div>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;

  // KPI Row
  const kpis = [
    { label: '🏆 POLE POSITION', value: leader.name.split(' ')[0], sub: leader.total.toFixed(1) + ' PTS' },
    { label: '📊 TEAM AVG', value: avg, sub: 'POINTS' },
    { label: '🎯 PODIUM PACE', value: qualified, sub: `OF ${reps.length} DRIVERS` },
    { label: '📅 RACE', value: '1', sub: 'OF 7 ROUNDS' },
  ];
  html += `<div class="kpi-row">`;
  kpis.forEach((k, i) => {
    html += `<div class="kpi-card" style="animation-delay:${i * 0.08}s">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-value">${k.value}</div>
      <div class="kpi-sub">${k.sub}</div>
    </div>`;
  });
  html += `</div>`;

  // Main grid
  html += `<div class="main-grid">`;

  // Left — Leaderboard
  html += `<div><div class="leaderboard-label">🏁 DRIVER STANDINGS</div>`;
  reps.forEach((rep, i) => {
    const tier = getTier(rep.total);
    const isLeader = i === 0;
    const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
    const teamColors = ['#E10600', '#00D2BE', '#FF8700', '#006F62', '#1E41FF', '#C92D4B', '#37BEDD', '#B6BABD'];
    const teamColor = teamColors[i % teamColors.length];
    html += `<div class="rep-card ${isLeader ? 'leader' : ''}" data-idx="${i}" style="animation-delay:${i * 0.05}s" onclick="toggleRep(${i})">
      <div class="rep-row">
        <div class="rep-rank ${rankClass}">${i + 1}</div>
        <div class="rep-avatar ${tier.cls}" style="border-color: ${teamColor}; color: ${teamColor};">${rep.avatar}</div>
        <div class="rep-info">
          <div class="rep-name">${rep.name}</div>
          <span class="rep-tier ${tier.cls}">${tier.label}</span>
        </div>
        <div class="rep-score-wrap">
          <div class="rep-score">${rep.total.toFixed(1)}</div>
          <div class="rep-score-max">/ 100 pts</div>
        </div>
      </div>
      <div class="rep-detail">
        ${CATS.map(c => {
          const pct = Math.min((rep[c.key] / c.max) * 100, 100);
          const r = 26, circ = 2 * Math.PI * r;
          const offset = circ - (pct / 100) * circ;
          return `<div class="detail-cell">
            <div class="detail-ring">
              <svg width="60" height="60" viewBox="0 0 60 60">
                <circle class="detail-ring-bg" cx="30" cy="30" r="${r}" />
                <circle class="detail-ring-fg" cx="30" cy="30" r="${r}"
                  stroke="${c.color}"
                  stroke-dasharray="${circ}"
                  stroke-dashoffset="${offset}" />
              </svg>
            </div>
            <div class="detail-val">${rep[c.key].toFixed(1)}</div>
            <div class="detail-label">${c.label}</div>
          </div>`;
        }).join('')}
      </div>
      <div style="text-align:center">
        <span class="pipeline-badge ${rep.supered.toLowerCase() === 'pass' ? 'pass' : 'fail'}">
          ${rep.supered.toLowerCase() === 'pass' ? '✓ CLEAN RACE' : '⚠ ' + rep.supered}
        </span>
      </div>
    </div>`;
  });
  html += `</div>`;

  // Right column
  html += `<div>`;

  // Chart
  const maxTotal = Math.max(...reps.map(r => r.total), 1);
  const chartMax = 100;
  const barH = 320;
  html += `<div class="panel" style="animation-delay:0.15s">
    <div class="panel-label">📊 CHAMPIONSHIP POINTS</div>
    <div class="chart-container">
      <div class="chart-bar-group" style="height:${barH}px; align-items: flex-end;">
        ${reps.map((rep, i) => {
          const segments = CATS.map(c => ({ h: (rep[c.key] / chartMax) * barH, color: c.color, label: c.label, val: rep[c.key] }));
          const totalH = segments.reduce((s, seg) => s + seg.h, 0);
          return `<div class="chart-col" data-rep="${i}"
              onmouseenter="showTooltip(event, ${i})" onmouseleave="hideTooltip()">
            <div class="chart-stack" style="height:${totalH}px">
              ${segments.reverse().map(seg => `<div class="chart-seg" style="height:${seg.h}px;background:${seg.color}"></div>`).join('')}
            </div>
            <div class="chart-name">${rep.name.split(' ')[0]}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="chart-tooltip" id="chartTooltip"></div>
    </div>
    <div class="chart-legend">
      ${CATS.map(c => `<div class="chart-legend-item"><div class="chart-legend-dot" style="background:${c.color}"></div>${c.label}</div>`).join('')}
    </div>
  </div>`;

  // Scoring system
  html += `<div class="panel" style="animation-delay:0.25s">
    <div class="panel-label">🏎️ POINTS SYSTEM</div>
    <div class="scoring-grid">
      ${CATS.map(c => `<div class="scoring-item">
        <div class="scoring-item-header">
          <div class="scoring-dot" style="background:${c.color}"></div>
          <div class="scoring-item-label">${c.label}</div>
        </div>
        <div class="scoring-item-value">${c.max} <span>pts max</span></div>
      </div>`).join('')}
    </div>
    <div class="penalty-box">
      <div class="penalty-title">⚠ TIME PENALTY</div>
      <div class="penalty-desc">10+ violations at race end = −10 championship points</div>
    </div>
  </div>`;

  // Eligibility
  html += `<div class="panel" style="animation-delay:0.32s">
    <div class="panel-label">🏁 RACE REQUIREMENTS</div>
    ${['Avg 12+ meeting sets / month (Jan–July)', 'Avg 10+ meeting holds / month (Jan–July)', 'Show rate must average ≥ 80%'].map(r =>
      `<div class="elig-rule"><div class="elig-check">✓</div><div class="elig-text">${r}</div></div>`
    ).join('')}
    <div class="ramp-box">
      <div class="ramp-title">🏎️ ROOKIE DRIVER BONUS</div>
      <div class="ramp-months">
        <div class="ramp-month"><div class="ramp-val">+20</div><div class="ramp-label">RACE 1</div></div>
        <div class="ramp-month"><div class="ramp-val">+10</div><div class="ramp-label">RACE 2</div></div>
        <div class="ramp-month"><div class="ramp-val">+5</div><div class="ramp-label">RACE 3</div></div>
      </div>
    </div>
  </div>`;

  html += `</div></div>`; // close right col + main grid

  document.getElementById('app').innerHTML = html;

  // Store reps globally for tooltip
  window._reps = reps;
}

// ============================================================
//  INTERACTIONS
// ============================================================
function toggleRep(idx) {
  const cards = document.querySelectorAll('.rep-card');
  cards.forEach((c, i) => {
    if (i === idx) c.classList.toggle('expanded');
    else c.classList.remove('expanded');
  });
}

function showTooltip(e, idx) {
  const rep = window._reps[idx];
  if (!rep) return;
  const tt = document.getElementById('chartTooltip');
  tt.innerHTML = `<div class="chart-tooltip-name">${rep.name}</div>
    ${CATS.map(c => `<div class="chart-tooltip-row">
      <div class="chart-tooltip-dot" style="background:${c.color}"></div>
      ${c.label}: <span class="chart-tooltip-val">${rep[c.key].toFixed(1)}</span>
    </div>`).join('')}
    <div class="chart-tooltip-row" style="margin-top:6px;font-weight:600;color:var(--text-primary)">
      Total: ${rep.total.toFixed(1)}
    </div>`;
  tt.classList.add('visible');

  const rect = e.currentTarget.getBoundingClientRect();
  const container = e.currentTarget.closest('.chart-container').getBoundingClientRect();
  tt.style.left = (rect.left - container.left - 40) + 'px';
  tt.style.top = '-10px';
}

function hideTooltip() {
  document.getElementById('chartTooltip').classList.remove('visible');
}

// ============================================================
//  FETCH & BOOT
// ============================================================
async function loadData() {
  try {
    const resp = await fetch(CSV_URL);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const text = await resp.text();
    const lines = parseCSV(text);
    const reps = extractReps(lines);
    render(reps);
  } catch (err) {
    document.getElementById('app').innerHTML = `
      <div class="status-msg">
        <p style="margin-bottom:12px">⚠ Could not fetch sheet data.</p>
        <p style="font-size:13px;color:var(--text-muted)">
          Make sure the sheet is shared as "Anyone with the link" → Viewer.<br>
          Sheet ID: <code style="background:rgba(255,255,255,0.05);padding:2px 8px;border-radius:4px">${SHEET_ID}</code>
        </p>
        <p style="font-size:12px;color:var(--text-muted);margin-top:8px">${err.message}</p>
      </div>`;
  }
}

loadData();

// Auto-refresh every 5 minutes
setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
</html>
